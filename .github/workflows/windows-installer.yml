name: Windows build and installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build and test RustBlocks (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: '& "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" rustblocks-installer.iss'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: RustBlocks-Windows-Setup
          path: dist/RustBlocks-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RustBlocks-Setup.exe
          generate_release_notes: true
